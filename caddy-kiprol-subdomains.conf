# Климатическое оборудование — поддомены КИПРОЛ
# Подключается из /etc/caddy/Caddyfile строкой: import /etc/caddy/kiprol-subdomains.conf
#
# Единый шаблон сайта: /opt/kiprol/plot/site
# Наполнение каждого поддомена: /opt/kiprol/plot/site/data/<сайт>/ (site.json + catalog.json + img/)

ac.kiprol.ru, tnaw.kiprol.ru, tngeo.kiprol.ru, tnaa.kiprol.ru, tnpool.kiprol.ru {
	encode zstd gzip
	# HTML/CSS/JS не кешировать (чтобы обновления дизайна сразу доходили до браузеров)
	@dynamic path / /index.html /style.css /app.js
	header @dynamic Cache-Control "no-cache, must-revalidate"
	# Форма заказа -> бэкенд (Python, 127.0.0.1:8080)
	handle /order {
		reverse_proxy 127.0.0.1:8080
	}
	# Всё остальное -> единый шаблон
	handle {
		root * /opt/kiprol/plot/site
		file_server
	}
}

# ===== Длинные имена -> редирект на короткие =====
teplososaw.kiprol.ru {
	redir https://tnaw.kiprol.ru{uri} permanent
}

teplososgeo.kiprol.ru {
	redir https://tngeo.kiprol.ru{uri} permanent
}

teplososaa.kiprol.ru {
	redir https://tnaa.kiprol.ru{uri} permanent
}

teplosospool.kiprol.ru {
	redir https://tnpool.kiprol.ru{uri} permanent
}
